name: release

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Optional full 40-character commit SHA that must be checked out'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: '1.98.1'

jobs:
  build-a:
    name: Build A (clean workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source-a
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust
        working-directory: source-a
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Check source identity
        working-directory: source-a
        env:
          EXPECTED_COMMIT: ${{ github.event.inputs.expected_commit }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -n "${EXPECTED_COMMIT:-}" ]; then
            case "$EXPECTED_COMMIT" in
              *[!0-9a-f]*|'')
                echo "expected_commit must be a lowercase 40-character commit SHA" >&2
                exit 1
                ;;
            esac
            [ "${#EXPECTED_COMMIT}" -eq 40 ] ||
              { echo "expected_commit must be 40 characters" >&2; exit 1; }
            [ "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT" ] ||
              { echo "checked out commit does not match expected_commit" >&2; exit 1; }
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] &&
             [ "${GITHUB_REF_NAME:-}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME:-} does not match package version $version" >&2
            exit 1
          fi

      - name: Build release archive A
        working-directory: source-a
        env:
          CARGO_HOME: ${{ github.workspace }}/cargo-home-a
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-a
          DIST_DIR: ${{ github.workspace }}/dist-a
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$DIST_DIR"
          bash ci/build-release.sh

      - name: Verify archive A
        working-directory: source-a
        env:
          DIST_DIR: ${{ github.workspace }}/dist-a
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "cannot read Cargo.toml version" >&2; exit 1; }
          archive="$(find "$DIST_DIR" -maxdepth 1 -type f -name '*.tar.gz')"
          [ -n "$archive" ] || { echo "build A produced no archive" >&2; exit 1; }
          ( cd "$DIST_DIR" && sha256sum -c "$(basename "$archive").sha256" )
          unpack="$(mktemp -d)"
          tar -xzf "$archive" -C "$unpack"
          bin="$(find "$unpack" -maxdepth 2 -type f -name gewu-multiverse)"
          [ -n "$bin" ] || { echo "no gewu-multiverse binary in the archive" >&2; exit 1; }
          "$bin" --version | grep -Fx "gewu-multiverse $version"

      - name: Upload build A
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-a
          path: ${{ github.workspace }}/dist-a/*
          if-no-files-found: error
          retention-days: 7

  build-b:
    name: Build B (clean workspace, different paths)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source-b-with-a-longer-name
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust
        working-directory: source-b-with-a-longer-name
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Check source identity
        working-directory: source-b-with-a-longer-name
        env:
          EXPECTED_COMMIT: ${{ github.event.inputs.expected_commit }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -n "${EXPECTED_COMMIT:-}" ]; then
            case "$EXPECTED_COMMIT" in
              *[!0-9a-f]*|'')
                echo "expected_commit must be a lowercase 40-character commit SHA" >&2
                exit 1
                ;;
            esac
            [ "${#EXPECTED_COMMIT}" -eq 40 ] ||
              { echo "expected_commit must be 40 characters" >&2; exit 1; }
            [ "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT" ] ||
              { echo "checked out commit does not match expected_commit" >&2; exit 1; }
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] &&
             [ "${GITHUB_REF_NAME:-}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME:-} does not match package version $version" >&2
            exit 1
          fi

      - name: Build release archive B
        working-directory: source-b-with-a-longer-name
        env:
          CARGO_HOME: ${{ github.workspace }}/cargo-home-b-with-a-longer-name
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-b-with-a-longer-name
          DIST_DIR: ${{ github.workspace }}/dist-b-with-a-longer-name
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$DIST_DIR"
          bash ci/build-release.sh

      - name: Verify archive B
        working-directory: source-b-with-a-longer-name
        env:
          DIST_DIR: ${{ github.workspace }}/dist-b-with-a-longer-name
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "cannot read Cargo.toml version" >&2; exit 1; }
          archive="$(find "$DIST_DIR" -maxdepth 1 -type f -name '*.tar.gz')"
          [ -n "$archive" ] || { echo "build B produced no archive" >&2; exit 1; }
          ( cd "$DIST_DIR" && sha256sum -c "$(basename "$archive").sha256" )
          unpack="$(mktemp -d)"
          tar -xzf "$archive" -C "$unpack"
          bin="$(find "$unpack" -maxdepth 2 -type f -name gewu-multiverse)"
          [ -n "$bin" ] || { echo "no gewu-multiverse binary in the archive" >&2; exit 1; }
          "$bin" --version | grep -Fx "gewu-multiverse $version"

      - name: Upload build B
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-b
          path: ${{ github.workspace }}/dist-b-with-a-longer-name/*
          if-no-files-found: error
          retention-days: 7

  verify-and-bundle:
    name: Verify clean builds and stage release assets
    needs:
      - build-a
      - build-b
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Download build A
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-a
          path: ${{ github.workspace }}/artifacts/release-a

      - name: Download build B
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-b
          path: ${{ github.workspace }}/artifacts/release-b

      - name: Compare both clean builds
        working-directory: verifier
        run: |
          set -euo pipefail
          bash ci/verify-reproducible.sh --self-test \
            "$GITHUB_WORKSPACE/artifacts/release-a" \
            "$GITHUB_WORKSPACE/artifacts/release-b"

      - name: Fetch Forgejo 17.0.0 and its published signature
        working-directory: verifier
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/forgejo"
          base='https://codeberg.org/forgejo/forgejo/releases/download/v17.0.0'
          for name in \
            forgejo-17.0.0-linux-amd64 \
            forgejo-17.0.0-linux-amd64.sha256 \
            forgejo-17.0.0-linux-amd64.asc; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors \
              --output "$GITHUB_WORKSPACE/forgejo/$name" "$base/$name"
          done

      - name: Stage the seven release assets
        working-directory: verifier
        run: |
          set -euo pipefail
          bash ci/stage-release-assets.sh \
            --build-dir "$GITHUB_WORKSPACE/artifacts/release-a" \
            --forgejo-dir "$GITHUB_WORKSPACE/forgejo" \
            --out "$GITHUB_WORKSPACE/release-assets" \
            --manifest "$GITHUB_WORKSPACE/release-manifest"
          [ "$(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -type f | wc -l)" -eq 7 ]

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ github.workspace }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload release checksum manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: ${{ github.workspace }}/release-manifest/RELEASE-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
