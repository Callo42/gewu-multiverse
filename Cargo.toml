[package]
name = "gewu-multiverse"
version = "0.1.34"
edition = "2024"
rust-version = "1.85"
description = "One bundled Forgejo on your machine and the agents you run on it, drawn as a terminal board."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Callo42/gewu-multiverse"
keywords = ["tui", "forgejo", "agents", "local"]
categories = ["command-line-utilities"]

[dependencies]
# ratatui — the terminal UI itself: layout, widgets and the frame loop of the screens.
ratatui = "0.29"
# crossterm — the terminal backend and key-event reader that ratatui draws into.
crossterm = "0.28"
# serde — turns the settings and credentials files into typed values, refusing
# unknown fields.
serde = { version = "1", features = ["derive"] }
# toml — the settings and credentials format, chosen because it takes comments and is
# hand-editable.
toml = "1"
# directories — finds the user's own configuration, state and data directories.
directories = "6"
# thiserror — derives the error types, so a bad file is a clear message and never a panic.
thiserror = "2"
# serde_json — writes the run plan and the append-only JSONL transcript of every run.
serde_json = "1"
# nix — sends a signal to an agent's whole process group, so stopping one stops its children too.
nix = { version = "0.30", default-features = false, features = ["signal", "fs", "poll"] }
# ureq — one blocking HTTPS request at a time to the model endpoint, with rustls and no async runtime.
ureq = "3"
# signal-hook — a safe signal handler, so a hand-off's `^C` does not kill the product
# (E-3). It is already in the tree through crossterm; naming it here makes the use direct.
signal-hook = "0.3"
# sha2 — checks the pinned Forgejo download against its published digest before the
# binary is renamed into place.
sha2 = "0.10"
# landlock — the safe, unprivileged way to confine an agent's shell to its workspace
# when this computer cannot give it a user and mount namespace (bwrap/unshare). The
# kernel feature is Linux 5.13+; where it is absent the board says runs are not
# confined. This is the one dependency the confinement needs; docs/engine.md names it.
landlock = "0.4"
# rustix — safe pidfd handles for the recovery signal path. It is already in the tree
# through crossterm; naming it here makes the use direct (the signal-hook precedent).
rustix = { version = "0.38", features = ["process"] }

[lints.rust]
unsafe_code = "forbid"
